<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL TV</title>
<style>
  html, body { margin:0; height:100%; background:#000; color:#888;
    font-family:sans-serif; overflow:hidden; }
  #p { width:100%; height:100%; }
  #msg { position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-size:4vw; }
</style>
</head>
<body>
<div id="p"></div>
<div id="msg" style="display:none">📺 TV desligada</div>

<script>
const q = new URLSearchParams(location.search);
const vid = q.get('v');
const t = parseFloat(q.get('t')) || 0;       // hora de início (unix, segundos)
const pos = q.get('pos');                     // se existir => em pausa nesta posição

if (!vid) {
  document.getElementById('msg').style.display = 'flex';
} else {
  let skew = 0; // diferença entre o relógio do utilizador e o do servidor

  // Corrige relógios desajustados usando o cabeçalho Date do próprio servidor
  const clockReady = fetch(location.pathname, { method: 'HEAD', cache: 'no-store' })
    .then(r => { const d = r.headers.get('Date'); if (d) skew = new Date(d).getTime() - Date.now(); })
    .catch(() => {});

  const apiReady = new Promise(res => { window.onYouTubeIframeAPIReady = res; });

  Promise.all([clockReady, apiReady]).then(() => {
    const now = () => (Date.now() + skew) / 1000;
    const start = (pos !== null) ? parseFloat(pos) : Math.max(0, now() - t);

    new YT.Player('p', {
      videoId: vid,
      width: '100%',
      height: '100%',
      playerVars: {
        autoplay: 1, controls: 0, disablekb: 1, rel: 0,
        playsinline: 1, modestbranding: 1, start: Math.floor(start)
      },
      events: {
        onReady: e => {
          e.target.seekTo(start, true);
          if (pos !== null) e.target.pauseVideo(); else e.target.playVideo();
        },
        onError: () => {
          const m = document.getElementById('msg');
          m.textContent = '⚠ Este vídeo não permite incorporação';
          m.style.display = 'flex';
        }
      }
    });
  });

  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
}
</script>
</body>
</html>
